    <path d="M20 32c8.4-6.4 17.8-13.6 28.8-17.8" fill="none" stroke="url(#mint)" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M20 32c8.4 6.4 17.8 13.6 28.8 17.8" fill="none" stroke="url(#mint)" stroke-width="4.4" stroke-linecap="round"/>
