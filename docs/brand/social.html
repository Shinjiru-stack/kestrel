<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kestrel social card</title>
<style>
  @font-face { font-family: "Sora"; src: url("../../crates/kestrel/ui/fonts/sora.woff2") format("woff2"); font-weight: 100 800; font-style: normal; }
  @font-face { font-family: "Inter"; src: url("../../crates/kestrel/ui/fonts/inter.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #050806; }
  svg { display: block; width: 1280px; height: 640px; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Kestrel — Cluster Intelligence</title>
  <desc id="desc">Kestrel social card with the Flight-path K mark, wordmark, and product positioning.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a100d"/>
      <stop offset="1" stop-color="#040705"/>
    </linearGradient>
    <linearGradient id="flight-a" x1="22" y1="23" x2="56" y2="7" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e2ffec"/>
      <stop offset=".55" stop-color="#9ef0c0"/>
      <stop offset="1" stop-color="#5fd897"/>
    </linearGradient>
    <linearGradient id="flight-b" x1="17" y1="10" x2="22" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c5ffd9"/>
      <stop offset="1" stop-color="#52c98c"/>
    </linearGradient>
    <linearGradient id="flight-c" x1="21" y1="34" x2="50" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9ef0c0"/>
      <stop offset="1" stop-color="#3f9f6e"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(270 230) rotate(52) scale(620 480)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9ef0c0" stop-opacity=".18"/>
      <stop offset="1" stop-color="#9ef0c0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#9ef0c0" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#page)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#halo)"/>
  <g transform="translate(84 152)">
    <rect x="0" y="0" width="220" height="220" rx="50" fill="#0a100d" stroke="#9ef0c0" stroke-opacity=".18"/>
    <g transform="translate(-17.8 -7) scale(3.6)">
      <path fill="url(#flight-b)" d="M17 10 23 10 22 52 19 58 16 52 15 10Z"/>
      <path fill="url(#flight-a)" d="M24 23C35 17 46 10 56 7L52 15 44 17 38 26 30 24 27 30Z"/>
      <path fill="url(#flight-c)" d="M23 34C32 39 41 47 50 58L42 57 38 50 31 52 27 44Z"/>
      <circle cx="55" cy="8" r="2.3" fill="#e2ffec"/>
      <circle cx="49.5" cy="57.5" r="1.6" fill="#9ef0c0"/>
      <circle cx="21" cy="32" r="1.5" fill="#e2ffec"/>
    </g>
  </g>
  <text x="360" y="240" fill="#f4fff8" font-family="Sora, Inter, Segoe UI, sans-serif" font-size="104" font-weight="600" letter-spacing="16">KESTREL</text>
  <text x="366" y="302" fill="#9ef0c0" font-family="Inter, Segoe UI, sans-serif" font-size="25" font-weight="600" letter-spacing="8">CLUSTER INTELLIGENCE</text>
  <text x="88" y="474" fill="#dcefe3" font-family="Inter, Segoe UI, sans-serif" font-size="30" font-weight="400">A local-first Kubernetes observatory with</text>
  <text x="88" y="520" fill="#dcefe3" font-family="Inter, Segoe UI, sans-serif" font-size="30" font-weight="400">evidence-grounded AI and approval-gated remediation.</text>
  <g transform="translate(88 566)">
    <circle cx="6" cy="0" r="6" fill="#9ef0c0"/>
    <text x="22" y="5" fill="#708d7b" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" letter-spacing="2.4">OLLAMA · GEMINI · OPENROUTER · ANTHROPIC · GITHUB COPILOT</text>
  </g>
</svg>
</body>
</html>
