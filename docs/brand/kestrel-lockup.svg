<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Kestrel — Cluster Intelligence</title>
  <desc id="desc">Kestrel wordmark and Flight-path K mark on an obsidian banner.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080c0a"/>
      <stop offset="1" stop-color="#050806"/>
    </linearGradient>
    <linearGradient id="card" x1="40" y1="24" x2="1160" y2="296" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101a14"/>
      <stop offset="1" stop-color="#080d0a"/>
    </linearGradient>
    <linearGradient id="flight-a" x1="22" y1="23" x2="56" y2="7" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e2ffec"/>
      <stop offset=".55" stop-color="#9ef0c0"/>
      <stop offset="1" stop-color="#5fd897"/>
    </linearGradient>
    <linearGradient id="flight-b" x1="17" y1="10" x2="22" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c5ffd9"/>
      <stop offset="1" stop-color="#52c98c"/>
    </linearGradient>
    <linearGradient id="flight-c" x1="21" y1="34" x2="50" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9ef0c0"/>
      <stop offset="1" stop-color="#3f9f6e"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(170 120) rotate(58) scale(310 250)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9ef0c0" stop-opacity=".14"/>
      <stop offset="1" stop-color="#9ef0c0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#page)"/>
  <rect x="24" y="24" width="1152" height="272" rx="30" fill="url(#card)" stroke="#9ef0c0" stroke-opacity=".14"/>
  <rect x="24" y="24" width="1152" height="272" rx="30" fill="url(#halo)"/>
  <g>
    <rect x="72" y="76" width="168" height="168" rx="38" fill="#0a100d" stroke="#9ef0c0" stroke-opacity=".16"/>
    <g transform="translate(56.6 69) scale(2.8)">
      <path fill="url(#flight-b)" d="M17 10 23 10 22 52 19 58 16 52 15 10Z"/>
      <path fill="url(#flight-a)" d="M24 23C35 17 46 10 56 7L52 15 44 17 38 26 30 24 27 30Z"/>
      <path fill="url(#flight-c)" d="M23 34C32 39 41 47 50 58L42 57 38 50 31 52 27 44Z"/>
      <circle cx="55" cy="8" r="2.3" fill="#e2ffec"/>
      <circle cx="49.5" cy="57.5" r="1.6" fill="#9ef0c0"/>
      <circle cx="21" cy="32" r="1.5" fill="#e2ffec"/>
    </g>
  </g>
  <text x="288" y="174" fill="#f4fff8" font-family="Sora, Inter, Segoe UI, sans-serif" font-size="86" font-weight="600" letter-spacing="14">KESTREL</text>
  <text x="292" y="220" fill="#9ef0c0" font-family="Inter, Segoe UI, sans-serif" font-size="21" font-weight="600" letter-spacing="7.2">CLUSTER INTELLIGENCE</text>
  <rect x="292" y="242" width="58" height="2" rx="1" fill="#9ef0c0" fill-opacity=".55"/>
  <text x="366" y="247" fill="#708d7b" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="500" letter-spacing="2.2">LOCAL-FIRST · APPROVAL-GATED</text>
