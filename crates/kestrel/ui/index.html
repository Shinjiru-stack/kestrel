  <div id="boot" class="boot">
    <div class="boot__mark"><svg class="icon"><use href="#i-logo"></use></svg></div>
    <div class="boot__word">KESTREL</div>
    <div class="boot__line"><span></span></div>
    <div class="boot__status" id="boot-status">Establishing secure link to cluster</div>
  </div>

  <div id="shell" class="shell" hidden>
    <header class="titlebar" data-tauri-drag-region>
      <div class="titlebar__brand" data-tauri-drag-region>
        <span class="brand-mark"><svg class="icon"><use href="#i-logo"></use></svg></span>
        <span class="brand-word">KESTREL</span>
        <span class="brand-divider"></span>
        <span class="brand-sub">CLUSTER INTELLIGENCE</span>
      </div>
      <button class="command-trigger" data-action="palette" aria-label="Open command palette">
        <svg class="icon"><use href="#i-search"></use></svg>
        <span>Search or jump to…</span>
        <kbd>Ctrl K</kbd>
      </button>
      <div class="titlebar__right">
        <button class="update-pill" id="update-pill" data-action="update-open" hidden>
          <svg class="icon"><use href="#i-download"></use></svg>
          <span id="update-pill-label">Update available</span>
        </button>
        <div class="link-pill" id="link-pill" title="Cluster connection">
          <span class="status-dot" data-status="connected"></span>
          <span id="link-label">LIVE</span>
        </div>
        <div class="window-controls" id="window-controls" hidden>
          <button data-window="minimize" aria-label="Minimize"><svg class="icon"><use href="#i-minimize"></use></svg></button>
          <button data-window="maximize" aria-label="Maximize"><svg class="icon"><use href="#i-maximize"></use></svg></button>
          <button data-window="close" class="danger" aria-label="Close"><svg class="icon"><use href="#i-close"></use></svg></button>
        </div>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <button class="cluster-switcher" data-action="settings" title="Cluster connection">
          <span class="cluster-switcher__mark"><svg class="icon"><use href="#i-layers"></use></svg></span>
          <span class="cluster-switcher__text">
            <strong id="cluster-name">connecting…</strong>
            <small id="cluster-meta">k3s</small>
          </span>
          <svg class="icon chevron"><use href="#i-chevron-down"></use></svg>
        </button>

        <nav class="nav" aria-label="Primary">
          <div class="nav__label">OPERATE</div>
          <a class="nav__item" data-nav="overview" href="#/overview">
            <svg class="icon"><use href="#i-grid"></use></svg><span>Overview</span>
          </a>
          <a class="nav__item" data-nav="workloads" href="#/workloads">
            <svg class="icon"><use href="#i-cube"></use></svg><span>Workloads</span>
            <span class="nav__badge" id="nav-pods-badge" data-tone="warning" hidden>0</span>
          </a>
          <a class="nav__item" data-nav="nodes" href="#/nodes">
            <svg class="icon"><use href="#i-server"></use></svg><span>Nodes</span>
          </a>
          <div class="nav__label">INTELLIGENCE</div>
          <a class="nav__item" data-nav="copilot" href="#/copilot">
            <svg class="icon"><use href="#i-sparkles"></use></svg><span>AI Copilot</span>
            <span class="nav__live">LIVE</span>
          </a>
          <a class="nav__item" data-nav="security" href="#/security">
            <svg class="icon"><use href="#i-shield"></use></svg><span>Security</span>
            <span class="nav__badge" id="nav-security-badge" data-tone="warning" hidden>0</span>
          </a>
        </nav>

        <div class="sidebar__spacer"></div>

        <div class="pulse-card">
          <div class="pulse-card__head">
            <span class="pulse-card__title">Cluster pulse</span>
            <span class="pulse-card__live" id="pulse-live"><i></i> LIVE</span>
          </div>
          <div class="pulse-card__chart" id="sidebar-pulse"></div>
          <div class="pulse-card__stats">
            <span><strong id="side-healthy">—</strong> healthy</span>
            <span><strong id="side-issues">—</strong> need attention</span>
          </div>
        </div>

        <div class="provider-chip" id="provider-chip" data-action="settings">
          <span class="provider-chip__mark" id="provider-mark">AI</span>
          <span class="provider-chip__text">
            <strong id="provider-name">Ollama</strong>
            <small id="provider-model">local model</small>
          </span>
          <span class="status-dot" data-status="connected" id="provider-dot"></span>
        </div>

        <div class="sidebar__footer">
          <a class="nav__item" data-nav="settings" href="#/settings">
            <svg class="icon"><use href="#i-settings"></use></svg><span>Settings</span>
          </a>
          <button class="nav__item" data-action="theme" title="Toggle theme">
            <svg class="icon" id="theme-icon"><use href="#i-sun"></use></svg><span id="theme-label">Dark mode</span>
          </button>
        </div>
      </aside>

      <main class="main">
        <div id="view" class="view" tabindex="-1"></div>
      </main>
    </div>
  </div>

  <div id="overlays">
    <div class="palette" id="palette" hidden>
      <div class="palette__scrim" data-action="palette-close"></div>
      <div class="palette__panel" role="dialog" aria-modal="true" aria-label="Command palette">
        <div class="palette__input">
          <svg class="icon"><use href="#i-search"></use></svg>
          <input id="palette-input" type="text" placeholder="Search pods, pages, actions…" autocomplete="off" spellcheck="false" />
          <kbd>ESC</kbd>
        </div>
        <div class="palette__results" id="palette-results"></div>
        <div class="palette__footer">
          <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
          <span><kbd>↵</kbd> select</span>
          <span><kbd>esc</kbd> close</span>
        </div>
      </div>
    </div>

    <div class="drawer" id="drawer" hidden>
      <div class="drawer__scrim" data-action="drawer-close"></div>
      <aside class="drawer__panel" role="dialog" aria-modal="true" aria-label="Pod details">
        <div id="drawer-content"></div>
      </aside>
    </div>

    <div class="modal" id="modal" hidden>
      <div class="modal__scrim" data-action="modal-close"></div>
      <div class="modal__panel" role="dialog" aria-modal="true">
        <div id="modal-content"></div>
      </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
