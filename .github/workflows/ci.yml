name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, test, build
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # No release build here on purpose. This job gates the four bundle jobs, so
      # anything slow in it delays every platform. Each bundle job already runs a
      # release compile of this same commit, so a release-only breakage still
      # fails the pipeline - just in the bundle that hits it, not before all four.

  bundle:
    name: Bundle ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            artifact: kestrel-windows-x64
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            artifact: kestrel-linux-x64
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: kestrel-macos-arm64
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            artifact: kestrel-macos-x64

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            libfuse2 \
            rpm \
            xdg-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}

      - name: Cache Tauri CLI
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-2.12.4-${{ runner.os }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked

      - name: Build bundles
        working-directory: crates/kestrel
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Stage artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find "target/${{ matrix.target }}/release/bundle" -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' \) \
            -exec cp {} dist/ \;
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > "SHA256SUMS-${{ matrix.artifact }}.txt"
          else
            shasum -a 256 * > "SHA256SUMS-${{ matrix.artifact }}.txt"
          fi
          ls -lh

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # Every push to main uploads bundles as workflow artifacts, which expire and
  # are easy to miss. This keeps a downloadable rolling build on the Releases
  # page so "latest main" is always installable, while tagged commits still get
  # their own immutable versioned release below.
  snapshot:
    name: Publish rolling main build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combine checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Every push gets its own immutable tag and release. The run number only
      # ever moves forward, so build tags never collide and each download stays
      # pinned to the commit that produced it.
      - name: Resolve build tag
        id: build
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version[[:space:]]*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "could not read the workspace version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish build pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          name: Kestrel ${{ steps.build.outputs.version }} build ${{ github.run_number }}
          body: |
            Automated build of `${{ github.sha }}` on `main`.

            - Version: `${{ steps.build.outputs.version }}`
            - Build: `${{ github.run_number }}`
            - Commit: `${{ github.sha }}`

            These bundles are unsigned development builds. Tagged `v*` releases are the stable ones.
          files: dist/*
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combine checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
