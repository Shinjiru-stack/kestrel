[workspace]
resolver = "2"
members = [
  "crates/kestrel-core",
  "crates/kestrel",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
authors = ["Kestrel"]
repository = "https://github.com/Shinjiru-stack/kestrel"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
k8s-openapi = { version = "0.28", features = ["v1_35"] }
kube = { version = "4.2", features = ["client", "rustls-tls"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "gzip"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
